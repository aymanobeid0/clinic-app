<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title description">
<title id="title">Proximity: compact grouping versus an empty reserved row</title>
<desc id="description">Two schematic login field groups. Related label and input pairs stay close in the first. An unused second row separates the same task in the second. These examples illustrate grouping and do not prescribe application page geometry.</desc>
<rect width="1000" height="510" fill="#f3f6f9"/>
<g font-family="Inter, Arial, sans-serif" fill="#182631">
<text x="32" y="40" font-size="24" font-weight="600">Proximity: related fields read as one task</text>
<text x="32" y="68" font-size="14" fill="#526b7d">Same visual language; different grouping. Empty space needs a purpose.</text>
<rect x="24" y="94" width="464" height="370" rx="20" fill="#fff"/>
<rect x="512" y="94" width="464" height="370" rx="20" fill="#fff"/>
<text x="48" y="127" font-size="16" font-weight="600" fill="#126344">USE: compact field group</text>
<text x="536" y="127" font-size="16" font-weight="600" fill="#b42318">AVOID: unused reserved row</text>
<text x="48" y="160" font-size="13">Adresse e-mail</text>
<rect x="48" y="170" width="416" height="40" rx="12" fill="#fff" stroke="#a9bac7"/>
<text x="48" y="244" font-size="13">Mot de passe</text>
<rect x="48" y="254" width="416" height="40" rx="12" fill="#fff" stroke="#a9bac7"/>
<rect x="48" y="318" width="416" height="48" rx="12" fill="#135d93"/>
<text x="64" y="348" font-size="14" fill="#fff">Se connecter</text>
<text x="48" y="402" font-size="13" fill="#526b7d">Label + input + feedback form one group.</text>
<text x="48" y="426" font-size="13" fill="#526b7d">The next related group follows without a blank row.</text>
<text x="536" y="160" font-size="13">Adresse e-mail</text>
<rect x="536" y="170" width="416" height="40" rx="12" fill="#fff" stroke="#a9bac7"/>
<path d="M940 222v100m-5-100h10m-10 100h10" stroke="#b42318" fill="none"/>
<text x="536" y="276" font-size="13" fill="#b42318">An empty row fragments the task.</text>
<text x="536" y="332" font-size="13">Mot de passe</text>
<rect x="536" y="342" width="416" height="40" rx="12" fill="#fff" stroke="#a9bac7"/>
<text x="536" y="426" font-size="13" fill="#526b7d">Do not use blank space to force stable positions.</text>
<text x="32" y="493" font-size="12" fill="#526b7d">Schematic examples only. Adapt grids to content, viewport and text enlargement; use approved spacing roles.</text>
</g>
</svg>
