services:
  database:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: clinic_issue7
      POSTGRES_USER: clinic_test
      POSTGRES_PASSWORD: fictional-only
    ports:
      - "127.0.0.1:${CLINIC_TEST_PORT:-55437}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_test -d clinic_issue7"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql
