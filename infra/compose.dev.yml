services:
  database:
    image: postgres:18.6-bookworm@sha256:afc7e2d441324c0388fa80c3d24f733b4194a4eb7f47dd8ee2b08eb1a24a647c
    environment:
      POSTGRES_DB: clinic_dev
      POSTGRES_USER: clinic_dev_owner
      POSTGRES_PASSWORD: local-fictional-owner
    ports:
      - "127.0.0.1:55438:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_dev_owner -d clinic_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - clinic_dev_data:/var/lib/postgresql
volumes:
  clinic_dev_data:
